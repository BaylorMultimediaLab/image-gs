seed:                  123
device:                "cuda:0"
realtime:              False # Real-time encoding
stall_trace:           0.0 # Log pruning rounds and CUDA graph captures that take longer than this many seconds
cuda_graph:            False # Replay each step from a CUDA graph; requires realtime, quant_mode step or none
warmup:                2.0 # realtime: discarded encode of this many seconds before the real one, so that first-use costs (kernel loading, the first graph capture and rounds) stay out of the budget; 0 disables it
# Evaluation
eval:                  False # Render the optimized Image-GS representation
render_height:         480 # Image height for rendering (aspect ratio is maintained)

# Bit precision
quant_mode:            "step" # {step, minmax, none} Quantization mode; --qp requires step or none
# quant_mode: "minmax" configuration:
pos_bits:              16 # minmax: bit depth of the positions
scale_bits:            16 # minmax: bit depth of the scales
rot_bits:              16 # minmax: bit depth of the rotations
feat_bits:             16 # minmax: bit depth of the features (RGB)
y_bits:                16 # minmax: bit depth of Y (YUV)
uv_bits:               16 # minmax: bit depth of U and V (YUV)
# quant_mode: "step" configuration:
pos_step:              0.125 # Position step in pixels
scale_step:            0.03125 # Scale step in octaves
rot_step:              0.703125 # Rotation step in degrees; per-Gaussian rotation steps require it to divide 22.5°, per-Gaussian position steps 90°
feat_step:             0.015625 # Feature step (RGB); set by --qp
y_step:                0.015625 # Y step (YUV); set by --qp
uv_step:               0.015625 # U and V step (YUV); set by --qp
uv_step_ratio:         2.0 # YUV: factor on the U and V step that gives the error of RGB features; only with --qp
y_step_ratio:          1.0 # YUV: factor on the Y step that gives the error of RGB features; only with --qp
feat_step_adapt:       "weight" # {weight, none} Per-Gaussian feature steps by the sum of the squared blending weights, or uniform
feat_step_gamma:       0.25 # Strength: steps scale as (proxy / its geometric mean)^−γ, snapped to powers of 2^(1/4) in [1/4, 4]
uv_step_gamma:         -1.0 # YUV: feat_step_gamma of U and V; negative uses feat_step_gamma
rot_step_adapt:        "aspect" # {aspect, none} Per-Gaussian rotation steps by aspect ratio, or uniform
rot_step_aspect:       3.0 # Aspect ratio in octaves from which Gaussians keep rot_step
rot_step_gamma:        0.5 # Exponent on the rotation sensitivity ratio
pos_step_adapt:        "major" # {major, none} Per-Gaussian position steps along the major axis with two-stage positions, or uniform
pos_step_gamma:        1.0 # Exponent on the position sensitivity ratio
scale_prediction:      True # step: code the scales as residuals of their prediction

bitstream_codec:       "rans" # {rans, none} Entropy coder (none: no bitstream); requires quantization
color_transform:       "subtract-green" # {subtract-green, none} RGB: code R−G, G, B−G; ignored in YUV
feat_prediction:       True # Code the features as residuals of their prediction

# Logging
log_root:              "results"
exp_name:              "test/uvg" # Path to the logging directory
log_level:             "INFO"
save_image_format:     "jpg"
save_plot_format:      "jpg"
vis_gaussians:         False # Visualize Gaussians during optimization
save_image_steps:      100000 # Frequency of rendering intermediate results during optimization
save_ckpt_steps:       100000 # Frequency of checkpointing during optimization
eval_steps:            100

# Target images
color_space:           "yuv" # {yuv, rgb} Color space of the Gaussian features and losses
uv_weight:             0.25 # YUV: weight of chroma in the losses, the pruning error, and the error map of densification; 1 matches RGB
data_root:             "media"
input_path:            "uvg/480p/Beauty_0001.png" # Path to an image file or a directory containing a texture stack

# Gaussians
num_gaussians:         1000 # Number of Gaussians without --qp; set by --qp
qp:                    32.0 # HEVC-like quantization parameter; 0 disables QP rate control
qp_overestimate:       0.6 # Factor on the content-agnostic number of Gaussians before pruning; only with --qp
qp_lambda_scale:       4.0 # Factor on HEVC's λ for pruning and the rate term; only with --qp
rate_weight:           0.25 # Weight of the rate term in the loss, relative to λ; 0 disables it; requires quant_mode step; only with --qp
rate_uv_weight:        -1.0 # YUV: weight of the U and V bits in the rate term; negative uses uv_weight; only with --qp
qp_offset:             6.47 # Offset of the QP mapping (0 with qp_slope 1 derives the settings at the QP itself); only with --qp
qp_slope:              0.767 # Slope of the QP mapping; only with --qp
init_scale:            2.25 # Initial size in pixels (with init_scale_knn 0)
init_scale_knn:        0.4 # Initial size as a factor of the RMS distance to the 3 nearest Gaussians; 0 uses init_scale
init_fine_ratio:       0.5 # Fraction of the Gaussians placed on fine blobs; 0 disables it
init_aspect:           4.0 # Maximum aspect ratio of initial and added Gaussians along edges; 1 keeps them isotropic
max_scale:             0.0 # Upper bound of the Gaussian scales in pixels (0 disables it); large Gaussians slow down rasterization
ckpt_file:             ""
add_color_init:        "target" # {target, residual} Features of added Gaussians: the target, or the error of the rendered image at the pixel
init_mode:             "local-std" # {local-std, gradient, random} Position density of the Gaussians that are not on fine blobs: local luma standard deviation, squared image gradient, or uniform
init_std_gamma:        0.8 # local-std: exponent of the local standard deviation
init_random_ratio:     0.0 # Fraction of the other Gaussians placed uniformly at random instead of by init_mode

# Loss functions
l1_loss_ratio:         1.0
ssim_loss_ratio:       0.1

# Optimization
max_steps:             0 # Budget in steps instead of max_time (which is then ignored), so that a run does not depend on the speed of the GPU; 0 uses max_time
pos_lr:                5.0e-4
scale_lr:              2.0e-3
rot_lr:                2.0e-3
feat_lr:               5.0e-3
disable_lr_schedule:   False # Disable the learning rate decay
decay_ratio:           10.0 # Factor of the learning rate decay
max_time:              4.0 # Optimization time budget in seconds (without max_steps)
decay_time_ratio:      0.8333 # Fraction of the budget after which the learning rate decays once by decay_ratio
lr_schedule:           "step" # {step, after, exp, cycle} A single decay by decay_ratio at decay_time_ratio of the budget, a single one decay_after_steps steps after the last pruning round (at the latest at decay_time_ratio), an exponential decay by decay_ratio over the budget, or one from the start and from each pruning round to the next round (the last one to the end)
decay_after_steps:     500 # lr_schedule after: steps between the last pruning round and the learning rate decay

# Pruning
prune_lambda:          0.0 # Rate–distortion pruning: squared-error increase per bit below which a Gaussian is removed; set by --qp; without --qp, 0 keeps the num_gaussians Gaussians
prune_max_ratio:       0.125 # Maximum fraction of the Gaussians removed per round
prune_add_ratio:       0.125 # Gaussians added after each round but the last, as a fraction of the remaining ones; 0 disables densification
prune_max_interval:    100 # As many rounds as keep them at most this many steps apart over the first prune_end_ratio of the budget (at the step rate so far with max_time)
prune_end_ratio:       0.6667 # Fraction of the budget over which the rounds are spread evenly
prune_min_interval:    20 # Minimum steps between rounds (and before the first), so that a stall does not trigger several rounds in a row