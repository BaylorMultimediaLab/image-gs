seed:                  123
device:                "cuda:0"
# Evaluation
eval:                  False # Render the optimized Image-GS representation
render_height:         2048 # Image height for rendering (aspect ratio is maintained)

# Bit precision
quant_mode:            "step" # Quantization of Gaussian parameters, valid values include "none" (float32), "minmax" (2^bits levels over the range of each attribute, set by the *_bits values), and "step" (fixed steps anchored at zero, set by the *_step values)
# quant_mode: "minmax" configuration:
pos_bits:              16 # Bit precision of individual coordinate dimension
scale_bits:            16 # Bit precision of individual scale dimension
rot_bits:              16 # Bit precision of Gaussian orientation angle
feat_bits:             16 # Bit precision of individual feature dimension (RGB mode, and single-channel images in YUV mode)
y_bits:                16 # Bit precision of the Y feature dimension (YUV mode only)
uv_bits:               16 # Bit precision of individual U and V feature dimensions (YUV mode only)
# quant_mode: "step" configuration:
# Step sizes from an equal-slope sweep (results/step-sweep): no step pays off when halved or doubled at the PSNR per bit of adding Gaussians
pos_step:              0.125 # Position step in pixels ("step" mode)
scale_step:            0.03125 # Scale step in octaves, i.e., log2 of the scale in pixels ("step" mode)
rot_step:              0.703125 # Rotation step in degrees, 180/256 so that wrap_rot keeps the grid intact ("step" mode)
feat_step:             0.03125 # Step of individual feature dimensions ("step" mode; RGB mode, and single-channel images in YUV mode)
y_step:                0.03125 # Step of the Y feature dimension ("step" mode; YUV mode only; not tuned, same as feat_step)
uv_step:               0.03125 # Step of individual U and V feature dimensions ("step" mode; YUV mode only; not tuned, same as feat_step)

wrap_rot:              False # Wrap Gaussian orientations to [0, pi) before quantization (ellipses are symmetric under rotation by pi)
bitstream_codec:       "none" # Write a compressed bitstream of the quantized Gaussians after optimization (or with eval) and verify that it decodes losslessly, valid values include "none" and "lzma" (Morton-sorted positions, delta coding, LZMA)

# Logging
log_root:              "results"
exp_name:              "test/anime-1_2k" # Path to the logging directory
log_level:             "INFO"
save_image_format:     "jpg"
save_plot_format:      "jpg"
vis_gaussians:         False # Visualize Gaussians during optimization
save_image_steps:      100000 # Frequency of rendering intermediate results during optimization
save_ckpt_steps:       100000 # Frequency of checkpointing during optimization
eval_steps:            100

# Target images
color_space:           "rgb" # Color space of Gaussian features and training losses, valid values include "yuv" and "rgb" (metrics and saved images are always RGB)
gamma:                 1.0 # Optimize in a gamma-corrected space, modify with caution
data_root:             "media"
input_path:            "images/anime-1_2k.png" # Path to an image file or a directory containing a texture stack
downsample:            False # Load a downsampled version of the input image or texture stack as the optimization target to evaluate image upsampling performance
downsample_ratio:      2.0

# Gaussians
num_gaussians:         10000 # Number of Gaussians (for compression rate control)
init_scale:            5.0 # Initial Gaussian scale in number of pixels
topk:                  10 # Warning: Must match hardcoded value in CUDA kernel, modify with caution
disable_topk_norm:     False # Disable top-K normalization
disable_inverse_scale: False # Disable inverse Gaussian scale optimization
ckpt_file:             ""
disable_color_init:    False
init_mode:             "gradient" # Gaussian position initialization mode, valid values include "gradient", "saliency", and "random"
init_random_ratio:     0.3 # Ratio of Gaussians with randomly initialized position
smap_filter_size:      20 # Gaussian filter size for smoothing saliency maps

# Loss functions
l1_loss_ratio:         1.0
l2_loss_ratio:         0.0
ssim_loss_ratio:       0.1

# Optimization
disable_tiles:         False # Disable tile-based rendering (warning: optimization and rendering without tiles will be way slower)
max_steps:             10000 # Maximum number of optimization steps
pos_lr:                5.0e-4
scale_lr:              2.0e-3
rot_lr:                2.0e-3
feat_lr:               5.0e-3
disable_lr_schedule:   False # Disable learning rate schedule and early stopping
decay_ratio:           10.0
check_decay_steps:     1000
max_decay_times:       1
decay_threshold:       1.0e-3
disable_prog_optim:    False # Disable error-guided progressive optimization
initial_ratio:         0.5
add_steps:             500
add_times:             4
post_min_steps:        3000

# Pruning
prune_ratio:           0.1 # Fraction of num_gaussians with the lowest score to prune once progressive optimization has added all Gaussians (the compression rate is based on the remaining Gaussians)
prune_times:           1 # Number of pruning rounds, each removing an equal share
prune_steps:           500 # Optimization steps before each pruning round
prune_score:           "loo" # Ranking of Gaussians for pruning, valid values include "contribution" (total blending weight) and "loo" (leave-one-out increase of the L1 loss)
relocate_ratio:        0.0 # Fraction of the Gaussians with the lowest score to replace at each densification step by additional error-guided Gaussians (keeps the number of Gaussians unchanged)